<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>我的讀書日誌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FAFAF7;
    --surface: #FFFFFF;
    --surface2: #F4F2EE;
    --border: rgba(0,0,0,0.10);
    --border2: rgba(0,0,0,0.06);
    --text: #1A1814;
    --text2: #6B6860;
    --text3: #9E9C96;
    --red: #993C1D;
    --red-light: #FAECE7;
    --red-mid: #F5C4B3;
    --red-dark: #712B13;
    --serif: 'Noto Serif TC', serif;
    --sans: 'Noto Sans TC', sans-serif;
  }

  html { font-size: 16px; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── NAV ── */
  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(250,250,247,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 0.5px solid var(--border);
    padding: 0 1.25rem;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-title {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--text);
  }

  .nav-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    color: var(--red);
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .nav-btn:active { background: var(--red-light); }

  /* ── VIEWS ── */
  .view { display: none; }
  .view.active { display: block; }

  /* ── HOME ── */
  .home-hero {
    padding: 2rem 1.25rem 1.5rem;
    border-bottom: 0.5px solid var(--border);
    background: var(--surface);
  }

  .home-eyebrow {
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.1em;
    margin-bottom: 0.5rem;
  }

  .home-heading {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.04em;
    margin-bottom: 0.25rem;
  }

  .home-sub {
    font-size: 13px;
    color: var(--text2);
  }

  .stats-row {
    display: flex;
    gap: 10px;
    padding: 1rem 1.25rem;
    background: var(--surface);
    border-bottom: 0.5px solid var(--border2);
  }

  .stat-box {
    flex: 1;
    background: var(--surface2);
    border-radius: 10px;
    padding: 0.75rem;
    text-align: center;
  }

  .stat-num {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 700;
    color: var(--red);
    display: block;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text3);
    margin-top: 2px;
  }

  .section-head {
    padding: 1.25rem 1.25rem 0.5rem;
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.1em;
    font-weight: 500;
  }

  /* ── BOOK CARD ── */
  .book-card {
    background: var(--surface);
    margin: 0 1.25rem 0.75rem;
    border-radius: 14px;
    border: 0.5px solid var(--border);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    -webkit-user-select: none;
    user-select: none;
  }
  .book-card:active { transform: scale(0.98); }

  .book-card-inner {
    display: flex;
    align-items: stretch;
    gap: 0;
  }

  .book-spine {
    width: 5px;
    background: var(--red);
    flex-shrink: 0;
  }

  .book-card-body {
    flex: 1;
    padding: 1rem 1rem 1rem 0.875rem;
  }

  .book-card-title {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }

  .book-card-meta {
    font-size: 12px;
    color: var(--text3);
    margin-bottom: 10px;
  }

  .book-card-chapters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .chapter-pill {
    font-size: 11px;
    background: var(--red-light);
    color: var(--red-dark);
    border-radius: 20px;
    padding: 3px 9px;
    font-weight: 500;
  }

  .book-card-arrow {
    padding: 1rem 1rem 1rem 0;
    display: flex;
    align-items: center;
    color: var(--text3);
    font-size: 18px;
  }

  /* ── ADD BOOK BTN ── */
  .add-book-btn {
    background: var(--surface);
    margin: 0 1.25rem 2rem;
    border-radius: 14px;
    border: 0.5px dashed var(--border);
    padding: 1rem;
    width: calc(100% - 2.5rem);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--text3);
    font-size: 14px;
    font-family: var(--sans);
    transition: background 0.15s, color 0.15s;
  }
  .add-book-btn:active { background: var(--red-light); color: var(--red); }

  /* ── BOOK DETAIL ── */
  .book-detail-header {
    background: var(--surface);
    padding: 1.5rem 1.25rem;
    border-bottom: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .book-seal {
    width: 52px;
    height: 52px;
    background: var(--red);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 11px;
    font-weight: 700;
    color: #FDE8E0;
    text-align: center;
    line-height: 1.5;
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }

  .book-detail-info { flex: 1; }

  .book-detail-title {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 3px;
  }

  .book-detail-sub {
    font-size: 12px;
    color: var(--text3);
  }

  .chapter-list-item {
    background: var(--surface);
    margin: 0 1.25rem 0.75rem;
    border-radius: 12px;
    border: 0.5px solid var(--border);
    padding: 1rem 1rem 1rem 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.875rem;
    transition: transform 0.15s;
  }
  .chapter-list-item:active { transform: scale(0.98); }

  .chapter-num-badge {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: var(--red-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 700;
    color: var(--red-dark);
    flex-shrink: 0;
  }

  .chapter-list-body { flex: 1; min-width: 0; }

  .chapter-list-title {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.04em;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chapter-list-date {
    font-size: 11px;
    color: var(--text3);
  }

  .chapter-list-arrow {
    color: var(--text3);
    font-size: 18px;
  }

  .add-chapter-btn {
    background: none;
    border: 0.5px dashed var(--border);
    border-radius: 12px;
    width: calc(100% - 2.5rem);
    margin: 0 1.25rem 2rem;
    padding: 0.875rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--text3);
    font-size: 14px;
    font-family: var(--sans);
    transition: background 0.15s, color 0.15s;
  }
  .add-chapter-btn:active { background: var(--red-light); color: var(--red); }

  .book-link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0 1.25rem 1.25rem;
    padding: 0.875rem;
    background: var(--red);
    color: #fff;
    border-radius: 12px;
    font-size: 14px;
    font-family: var(--sans);
    font-weight: 600;
    text-decoration: none;
    transition: opacity 0.15s;
  }
  .book-link-btn:active { opacity: 0.8; }

  /* ── CHAPTER DETAIL ── */
  .chapter-hero {
    background: var(--surface);
    padding: 1.25rem 1.25rem 1.5rem;
    border-bottom: 0.5px solid var(--border);
  }

  .chapter-hero-top {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .chapter-seal-lg {
    width: 54px;
    height: 54px;
    background: var(--red);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 12px;
    font-weight: 700;
    color: #FDE8E0;
    text-align: center;
    line-height: 1.5;
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }

  .chapter-hero-info { flex: 1; }

  .chapter-eyebrow-sm {
    font-size: 11px;
    color: var(--red);
    letter-spacing: 0.1em;
    font-weight: 500;
    margin-bottom: 3px;
  }

  .chapter-title-lg {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text);
    margin-bottom: 2px;
  }

  .chapter-date-sm {
    font-size: 11px;
    color: var(--text3);
  }

  /* ── NOTE BLOCKS ── */
  .note-section {
    padding: 1.25rem 1.25rem 0;
  }

  .note-section-label {
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.12em;
    font-weight: 500;
    margin-bottom: 0.75rem;
    text-transform: uppercase;
  }

  .note-tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 1.5rem;
  }

  .note-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 0.6rem 0.875rem;
  }

  .note-tag-icon {
    font-size: 15px;
    color: var(--red);
  }

  .note-tag-text {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .tactic-list { margin-bottom: 1.5rem; }

  .tactic-item {
    background: var(--surface);
    border-radius: 10px;
    border: 0.5px solid var(--border);
    padding: 0.875rem;
    margin-bottom: 8px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .tactic-ctx {
    font-size: 11px;
    background: var(--surface2);
    border-radius: 5px;
    padding: 3px 8px;
    color: var(--text2);
    white-space: nowrap;
    font-weight: 500;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .tactic-content { flex: 1; }
  .tactic-main { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
  .tactic-sub { font-size: 12px; color: var(--text3); line-height: 1.6; }

  .technique-card-mobile {
    background: var(--surface);
    border-radius: 10px;
    border: 0.5px solid var(--border);
    padding: 0.875rem;
    margin-bottom: 8px;
  }

  .technique-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  .technique-name {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.03em;
  }

  .technique-badge {
    font-size: 10px;
    background: var(--red-light);
    color: var(--red);
    border-radius: 4px;
    padding: 2px 7px;
    font-weight: 500;
  }

  .technique-body {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.75;
  }

  .flow-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }

  .flow-pill {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 5px;
    padding: 4px 9px;
  }

  .flow-arr { color: var(--red); font-size: 14px; }

  .raw-notes {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    font-size: 13px;
    color: var(--text2);
    line-height: 1.9;
    white-space: pre-wrap;
    word-break: break-all;
    margin-bottom: 1.5rem;
    font-family: var(--sans);
  }

  /* ── FORMS ── */
  .form-view { padding: 1.25rem; }

  .form-title {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 1.5rem;
    letter-spacing: 0.04em;
  }

  .form-group { margin-bottom: 1.125rem; }

  .form-label {
    display: block;
    font-size: 12px;
    color: var(--text2);
    font-weight: 500;
    margin-bottom: 6px;
    letter-spacing: 0.05em;
  }

  .form-input, .form-textarea, .form-select {
    width: 100%;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    font-size: 15px;
    font-family: var(--sans);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
    appearance: none;
    -webkit-appearance: none;
  }

  .form-input:focus, .form-textarea:focus, .form-select:focus {
    border-color: var(--red);
  }

  .form-textarea {
    min-height: 140px;
    resize: vertical;
    line-height: 1.7;
  }

  .form-select { cursor: pointer; }

  .form-hint {
    font-size: 11px;
    color: var(--text3);
    margin-top: 5px;
  }

  .btn-primary {
    width: 100%;
    background: var(--red);
    color: #FDE8E0;
    border: none;
    border-radius: 12px;
    padding: 1rem;
    font-size: 16px;
    font-family: var(--sans);
    font-weight: 500;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: opacity 0.15s, transform 0.1s;
    letter-spacing: 0.04em;
  }
  .btn-primary:active { opacity: 0.85; transform: scale(0.98); }

  .btn-ghost {
    width: 100%;
    background: none;
    color: var(--text2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    font-size: 15px;
    font-family: var(--sans);
    cursor: pointer;
    margin-top: 0.5rem;
  }
  .btn-ghost:active { background: var(--surface2); }

  /* ── BOTTOM PADDING ── */
  .bottom-pad { height: 2.5rem; }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1A1814;
    color: #F4F2EE;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 20px;
    z-index: 999;
    transition: transform 0.3s ease;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 3rem 2rem;
    color: var(--text3);
  }

  .empty-icon { font-size: 48px; margin-bottom: 1rem; }
  .empty-title { font-family: var(--serif); font-size: 18px; color: var(--text2); margin-bottom: 0.5rem; }
  .empty-sub { font-size: 13px; line-height: 1.6; }

  /* ── TABS ── */
  .detail-tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    position: sticky;
    top: 52px;
    z-index: 50;
  }

  .detail-tab {
    flex: 1;
    padding: 0.875rem 0;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    color: var(--text3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }

  .detail-tab.active {
    color: var(--red);
    border-bottom-color: var(--red);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── DELETE BTN ── */
  .danger-zone {
    padding: 1.25rem;
    margin-top: 0.5rem;
  }

  .btn-danger {
    width: 100%;
    background: none;
    color: #C0392B;
    border: 0.5px solid #F5C4B3;
    border-radius: 12px;
    padding: 0.875rem;
    font-size: 14px;
    font-family: var(--sans);
    cursor: pointer;
  }
  .btn-danger:active { background: #FAECE7; }

  /* scrollbar */
  ::-webkit-scrollbar { display: none; }
  /* ══════════════ VISUALIZATION (圖解) ══════════════ */
  .viz-wrap { padding: 1.25rem 1.25rem 0; }

  .viz-block { margin-bottom: 1.75rem; }

  .viz-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
  }

  .viz-title {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.06em;
  }

  .viz-hint {
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.02em;
  }

  .viz-tool {
    margin-left: auto;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 20px;
    padding: 4px 11px;
    font-size: 11px;
    font-family: var(--sans);
    color: var(--red);
    cursor: pointer;
    white-space: nowrap;
  }
  .viz-tool:active { background: var(--red-light); }

  /* ── MIND MAP ── */
  .mindmap-scroll {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .mindmap-scroll svg { display: block; }
  .mindmap-scroll.fit { overflow-x: hidden; }
  .mindmap-scroll.fit svg { width: 100%; height: auto; }

  /* ── KEYWORD CLOUD ── */
  .kw-cloud {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1.4rem 1rem;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: center;
    gap: 10px 14px;
  }

  .kw-word {
    font-family: var(--serif);
    font-weight: 700;
    letter-spacing: 0.05em;
    line-height: 1.25;
  }

  /* ── CONTEXT MATRIX ── */
  .ctx-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  @media (min-width: 620px) {
    .ctx-grid { grid-template-columns: 1fr 1fr; }
  }

  .ctx-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .ctx-card-head {
    background: var(--red);
    color: #FDE8E0;
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .ctx-card-count {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 400;
    opacity: 0.75;
    letter-spacing: 0.04em;
  }

  .ctx-card-body { padding: 4px 12px 10px; }

  .ctx-row {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    padding: 9px 0;
    border-top: 0.5px dashed var(--border2);
  }
  .ctx-row:first-child { border-top: none; }

  .ctx-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--red-mid);
    flex-shrink: 0;
    margin-top: 7px;
  }

  .ctx-main { font-size: 13.5px; font-weight: 500; color: var(--text); line-height: 1.5; }
  .ctx-sub { font-size: 11.5px; color: var(--text3); line-height: 1.7; margin-top: 3px; }

  /* ── FLOW CHART ── */
  .flowc {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 0.95rem 1rem 1.1rem;
    margin-bottom: 10px;
  }

  .flowc-head {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .flowc-name {

  apiKey: "AIzaSyCc9aI4NjL5CDSoALoQKKTCZPxDz1D0Tqg",

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const DATA_DOC = doc(db, 'journal', 'main');

/* ─────────── IN-MEMORY CACHE ─────────── */
let _cache = { books: [] };

async function loadData() {
  try {
    const snap = await getDoc(DATA_DOC);
    if (snap.exists()) _cache = snap.data();
    else _cache = { books: [] };
  } catch(e) {
    console.warn('Firebase read failed, using cache', e);
  }
  return _cache;
}

async function saveData(data) {
  _cache = data;
  try {
    await setDoc(DATA_DOC, data);
  } catch(e) {
    console.error('Firebase write failed', e);
    showToast('⚠️ 儲存失敗，請檢查網路');
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

/* ─────────── REAL-TIME SYNC ─────────── */
function startRealtimeSync() {
  onSnapshot(DATA_DOC, (snap) => {
    if (snap.exists()) {
      _cache = snap.data();
      // Re-render current view silently
      if (state.view === 'home') renderHome();
      else if (state.view === 'book') renderBook();
    }
  }, (err) => console.warn('Snapshot error', err));
}

  notes: `一、保持「中庸」：恰到好處地做正確的事\n中庸不是一味冒險，也不是畏縮不前；既不偏激，也不隨波逐流。它是在不同意見與力量之間尋求共識和諧的科學方法，能有效提升看問題的深度。\n核心心態：保持客觀、開放、冷靜。\n延伸思維：必須有意識地避免「先入為主」與「情感偏見」。在面對複雜局面時，情感往往會蒙蔽理智，唯有抽離情緒，才能看清事物的本質。\n剛柔並濟：在「剛烈」與「軟弱」中取得動態平衡，不隨波逐流。過剛易折，過柔則任人宰割，真正的中庸是審時度勢後的精準拿捏。\n\n二、適度「示形」：展現自己的優勢\n辦事過程中，應適度展示個人的「外在特徵」（如駕駛的車輛、結交的朋友、從事的職業、擁有的背景等），這些能增強給他人的正面印象，使溝通與合作更加順暢。\n「細節決定成敗」，外在的儀表與言談舉止是他人評估你辦事能力的第一信號。\n重要原則：並非採取侵略性行為，而是在「尊重他人」的同時，「堅定地維護自己的立場」。\n\n三、熟練「潛規則」：雙向互利的求助藝術\n人們通常更願意幫助那些「能給他們帶來利益或價值的人」。\n① 先「客套」：求助前先寒暄，避免太直接，潤滑人際關係。\n② 態度謙恭：降低姿態，避免處在「支配地位」。\n③ 換位思考：真正理解他人的難處與需求。\n④ 人情互換：求助要記得互惠，關係才能長久。\n\n四、「以迂為直」：避免硬碰硬的迂迴策略\n在辦事過程中遇到強硬對手時，硬碰硬只會兩敗俱傷。\n核心實踐：嘗試在「不偏離目標」的方向，繞個彎。\n「迂迴」並非放棄目標，而是將直線前進改為曲線推進。透過暫時的退讓或改變切入點，避開對手鋒芒，最終達到相同的目的。\n\n五、在「變化中」找出「不變」\n市場與環境天天在變（變），但人性的需求、商業的本質與辦事的底層邏輯（不變）始終不變。洞察那些核心的「不變」，就能在萬變的局勢中保持定力。\n核心心態：透過創新和出人意料的舉措佔據優勢。適時變通思維、升級認知，在變化中追隨不變，用「不變」贏得未來。\n\n六、靈活運用「逆向思維」\n心理逆向：順著對方找出需求，再反其道而行，打破對方預期。\n方法與目標逆向：先找出結果（明確目標），再回推找出解決辦法。\n案例：金條切兩刀給工人發7天薪水——切成1/7、2/7、4/7三份，透過「給予與找零」組合，完美解決每天結帳需求。\n缺點逆向：先找出缺點，再把缺點放到別處，讓缺點變為獨特閃光點。沒有絕對的垃圾，只有放錯位置的資源。\n\n七、培養「破局思維」：提升認知水準\n認知水準低的人決策單一狹窄；認知水準高的人決策多維靈活。人生如棋，識局者生，破局者存，掌局者贏。\n四大破局策略：\n① 思考問題：把問題分解成具體目標，制定短期與長期策略。\n② 主動學習：保持思維活躍，打破「窮忙心亂」的惡性循環。\n③ 一維時間思維：建立長遠的時間跨度審視投資與選擇，延長決策生命週期。\n④ 拓展自我邊界：大膽走出舒適圈，提升認知，賦予自己更多信心和選擇權。`,

  notes: `一、危機與意外應對\n核心：當意外、錯誤降臨時「冷靜」應對尷尬局面。\n面對突發狀況，首要保持情緒穩定。\n借題發揮，緩解危機：善用比喻，透過生動、恰當的比喻轉移焦點或化解緊繃氣氛。\n把錯誤強化為正確——將錯就錯：在適當情況下順應錯誤，將其轉化為新的合理發展或台階。\n\n二、捨得思維\n核心：辦事的智慧在於平衡「得」與「捨」。\n先「捨」後「得」：沒有捨棄的追求，往往會讓人陷入疲憊與焦慮。懂得適時放手，才能獲得真正前進的動力。\n大捨大得，小捨小得，不捨不得。\n捨得要平衡：要捨得自損，勿損他人以利己。過度的欲望與一味追求自利往往適得其反，甚至遭遇凶險。懂得智地取捨、保持內心平衡，才能獲得真正的成功與滿足。\n\n三、利益與人情世故\n核心：把他人利益放在心上。\n「心中有我，我心中有你」→ 利益捆綁：辦事能力強的人，善於從「利益」入手，主動分析對方的立場、主張及行為。當利益給到位時，事情往往能迎刃而解。\n社會上每個人都有自己的利益訴求，僅憑交情和感情或許能成事一兩次，但難以長久。辦事的本質是合作與交易。\n人情世故的誠意：不論辦什麼事，事先慷慨地把「好處」準備好，這是行走於社會必須懂得的人情世故，也是展現辦事誠意的表現。\n\n四、人際交往與情感帳戶\n核心：以「情」動人。\n避免高估與他人的關係：保持理智，不對人際關係抱持不切實際的過高期待。\n不要用「情」包裝「理」：與人溝通時，不應一味用情感綁架去包裝本應釐清的道理。\n「人情債」也有底線：人情往來有其分寸，不可過度消耗。\n將每一次人際交往，都看作在他人「情感帳戶」中的存款機會：透過關心、支持、理解和幫忙，持續為彼此的感情儲值。當需要請求協助（消費人情）時，帳戶才能保證有足夠的餘額。\n\n五、溝通與說話藝術\n核心：學會「模糊表達」。\n避免非黑即白：世界存在許多灰色地帶。若一味採用「二分法」，容易讓當事人難以接受。\n靈活運用「默契」與「領悟」：在人際溝通中，有時不必把話說得太滿或太死，注重心理上的點到為止。\n既不讚同，也不反對之觀點：當表達既不同意、但也不想公開反對的觀點時，學會使用模稜兩可、具有彈性的語言。這既能避免碰壁、惹來不必要的麻煩，也是對他人和自己的一種保護。\n\n六、送禮與求人辦事\n核心：送人情後的進退之道。\n送禮原則：\n① 投其所好：送對方真正需要或喜歡的東西。\n② 不貿然送：缺乏鋪陳或時機不對時不要盲目送禮。\n③ 避免一次給足 → 讓人持續保持渴望：分次、適度給予，比一次填滿更有延伸的空間。\n④ 不宜硬送：強行送禮容易招致反感。\n⑤ 禮不要過重 → 對方會有心理壓力：禮物分量要適中，以免變成對方的負擔。\n送人情後不催促：禮物或幫助雖然會讓對方產生幫忙的義務感，但仍必須給予對方足夠的辦事時間與空間。不能過於頻繁催促，否則會讓對方感到厭煩，適得其反。\n做好辦事不成的心理準備：坦然面對可能失敗的結果。一旦未能如願，切不可責怪、抱怨或到處宣揚，否則不僅會毀掉對方的名聲，更會讓自己的聲譽受損。\n\n七、決策分析方法\n核心：做出最符合預期的權衡利弊決策。\n① 明確需求：深入了解自己真正想實現、想獲得的是什麼。\n② 列出所有利弊（Pros & Cons）：直接／間接的影響，短期／長期的效應。\n③ 評估利弊重要性 → 可透過為利弊打分數：衡量各項利弊對自己的核心價值與目標有多大影響，給予相應權重。\n④ 根據利弊分數進行排序：依據量化或排序結果，優化資源配置，做出更明智的決定。\nSWOT 分析工具：S（優勢）、W（劣勢）、O（機會）、T（威脅）。\n\n八、風險管理與備援計畫\n核心：凡事預則立，不預則廢——制定 B 計畫。\n無論是團隊發展、人生規劃還是生活瑣事，都不能不做充分準備。一旦遭遇突發問題，若沒有替代備選方案（B 計畫），就會措手不及。\n制定 B 計畫的五大步驟：\n① 明確目標 → 具體、可衡量、可達成。\n② 分析 A 計畫 → 權衡利弊，識別潛在風險。\n③ 制定 B 計畫 → 從 A 計畫的風險中制定，以排除風險。\n④ 評估 B 計畫：確保備援計畫在需要時具備可行性。\n⑤ 制定詳細計畫 → 使執行 A 計畫時充滿自信：當背後有完善的 B 計畫作為後盾時，執行原定計畫便能毫無後顧之憂。`,

  notes: '【核心觀點】從「命令與控制」走向「僕人式領導」\n傳統日式管理偏向微觀管理（命令與控制），將員工視為需要被監督的「受雇者」；而現代敏捷團隊（如微軟模式）則採用「僕人式領導」，將成員視為平等的「利益相關者（Stakeholder）」，透過充分賦權激發團隊的最大效能。\n\n一、領導模式與思維的轉變\n• 給目標與權限，而非下達指令\n   → 命令與控制（由上而下）：上級給予指令與限制，員工被動「等待指示」、被迫執行，扼殺了思考空間\n   → 僕人式領導（由下而上）：上級針對願景、戰略與 KPI 定立明確目標，並賦予第一線充分的權限與發揮空間，由執行成員自行思考與決定如何推進\n• 主管角色的重新定義\n   → 主管不再是發號施令的管理者，而是「支援者」與「障礙排除者」\n   → 核心任務：相信 IC（獨立貢獻者）、提供資源與支援、排除阻礙、維持整體目標與願景\n\n二、自組織團隊（Self-Organizing Teams）的運作\n• 球隊比喻：高層像球隊老闆（設定賽季目標與爭取資源）；中階像教練團（打造戰術體系、排解一線疑慮）；團隊成員像場上球員（分工互補、充分發揮）\n• 團隊成員不分上下級，大家都是夥伴、一律平等\n• 獨立商店模式（以 IC 為核心）：每位成員都像是經營一間獨立商店（或多店合作），擁有高度彈性與決策權\n• 擺脫微觀管理，改以「待辦事項清單」與「大計畫」來安排工作，讓成員自主選題與規劃時程\n• 自組織團隊的三大優勢：\n   ① 生產力提高：信任團隊自主做決定，大幅縮短前置審批與溝通內耗\n   ② 參與度與滿意度提升：讓成員在工作中樂在其中，而非被迫執行\n   ③ 採取更佳的解決方案：第一線最了解實際狀況，由實作人員決策能產出更高質量的成果\n\n三、打造健康團隊文化的關鍵體悟\n• 不急於求成，是對未來的長期投資 → 與其為了趕交期而推出不成熟的產品導致後續維護困難，不如讓團隊在良好架構下穩健產出真正有信心的成果\n• 不否定他人，營造安全且快樂的工作環境 → 建立可以互相提問、發表意見的心理安全感，包容不足並肯定每位夥伴的貢獻\n• 培養團隊的幸福感與信任 → 完全信任成員並一視同仁，將成就歸功於一線執行者，讓團隊在被尊重與被賦權的環境中發揮最大潛力',

/* 通用：依書名關鍵詞找書（找不到才建立），補上缺少的章節。
   每個章節只會被種入一次（記錄在 data.appliedSeeds），
   所以使用者之後自己刪掉章節或整本書，重新整理也不會再長回來。 */
function ensureBookChapters(data, bookDef, chapters) {
  if (!Array.isArray(data.appliedSeeds)) data.appliedSeeds = [];
  const applied = data.appliedSeeds;
  let changed = false;
  let book = data.books.find(b => (b.title || '').includes(bookDef.match));

  chapters.forEach(([chapter, dupKeyword]) => {
    if (applied.includes(chapter.id)) return;

    const exists = book && book.chapters.some(c =>
      c.id === chapter.id || (c.title || '').includes(dupKeyword)
    );

    if (!exists) {
      if (!book) {
        book = {
          id: bookDef.id,
          title: bookDef.title,
          author: bookDef.author || '',
          createdAt: new Date().toISOString(),
          chapters: []
        };
        data.books.push(book);
      }
      book.chapters.push({ ...chapter, number: book.chapters.length + 1 });
    }

    applied.push(chapter.id);
    changed = true;
  });

  return changed;
}

/* 《高效偷懶》— 新增章節時在陣列加一行即可 */

  return ensureBookChapters(data,

async function seedAndMigrate() {
  const data = await loadData();
  let changed = false;

  if (data.books.length === 0) {
    // Brand new user → seed all chapters
    data.books.push({
      id: 'default_book_1',
      title: '辦事兵法',
      author: '',
      createdAt: new Date().toISOString(),
      chapters: [DEFAULT_CH_1, DEFAULT_CH_2, DEFAULT_CH_3, DEFAULT_CH_4, DEFAULT_CH_5, DEFAULT_CH_6, DEFAULT_CH_7, DEFAULT_CH_8, DEFAULT_CH_9]
    });
    changed = true;
  } else {
    const book = data.books.find(b => b.id === 'default_book_1');
    if (book) {

      // Helper: inject structured fields into a chapter if tactics are missing
      const inject = (ch, defaults) => {
        if (ch && (!ch.tactics || ch.tactics.length === 0)) {
          ch.keywords  = defaults.keywords;
          ch.tactics   = defaults.tactics;
          ch.techniques = defaults.techniques;
          changed = true;
        }
      };

      // CH1: fixed id
      const ch1 = book.chapters.find(c => c.id === 'default_ch_1');
      inject(ch1, DEFAULT_CH_1);

      // CH2: fixed id OR position [1] (handles 協和計)
      let ch2 = book.chapters.find(c => c.id === 'default_ch_2');
      if (!ch2) ch2 = book.chapters.find(c => c.title === '協和計');
      if (!ch2) ch2 = book.chapters[1];
      inject(ch2, DEFAULT_CH_2);

      // CH3: by title 借勢計 OR position [2]
      let ch3 = book.chapters.find(c => c.title === '借勢計');
      if (!ch3) ch3 = book.chapters[2];
      inject(ch3, DEFAULT_CH_3);

      // CH4: by title 奇正計 OR position [3] — add if completely missing
      let ch4 = book.chapters.find(c => c.title === '奇正計');
      if (!ch4 && book.chapters.length < 4) {
        book.chapters.push(DEFAULT_CH_4);
        changed = true;
      } else {
        inject(ch4, DEFAULT_CH_4);
      }

      // CH5: by title 剛柔計 — add if missing
      let ch5 = book.chapters.find(c => c.title === '剛柔計');
      if (!ch5) {
        book.chapters.push(DEFAULT_CH_5);
        changed = true;
      } else {
        inject(ch5, DEFAULT_CH_5);
      }

      // CH6: by title 虛實計 — add if missing
      let ch6 = book.chapters.find(c => c.title === '虛實計');
      if (!ch6) {
        book.chapters.push(DEFAULT_CH_6);
        changed = true;
      } else {
        inject(ch6, DEFAULT_CH_6);
      }

      // CH7: by title 權宜計 — add if missing
      let ch7 = book.chapters.find(c => c.title === '權宜計');
      if (!ch7) {
        book.chapters.push(DEFAULT_CH_7);
        changed = true;
      } else {
        inject(ch7, DEFAULT_CH_7);
      }

      // CH8: by title 進退計 — add if missing
      let ch8 = book.chapters.find(c => c.title === '進退計');
      if (!ch8) {
        book.chapters.push(DEFAULT_CH_8);
        changed = true;
      } else {
        inject(ch8, DEFAULT_CH_8);
      }

      // CH9: by title 晉升計 — add if missing
      let ch9 = book.chapters.find(c => c.title === '晉升計');
      if (!ch9) {
        book.chapters.push(DEFAULT_CH_9);
        changed = true;
      } else {
        inject(ch9, DEFAULT_CH_9);
      }
    }
  }

  if (migrateLazyEfficiency(data)) changed = true;
  if (migrateMuskBible(data)) changed = true;

  if (changed) await saveData(data);
  return data;
}

let state = { view: 'home', bookId: null, chapterId: null, chapterTab: 'notes', history: [] };

function showView(name, pushHistory = true) {
  if (pushHistory) state.history.push(state.view);
  state.view = name;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');

  const backBtn = document.getElementById('nav-back');
  const addBtn = document.getElementById('nav-add');
  const title = document.getElementById('nav-title');

  const noBack = ['home', 'add-book', 'add-chapter'];
  const noAdd = ['add-book', 'add-chapter'];

  backBtn.style.display = noBack.includes(name) ? 'none' : 'flex';
  addBtn.style.display = noAdd.includes(name) ? 'none' : 'flex';

  const titles = {
    'home': '讀書日誌',
    'book': currentBook()?.title || '書本',
    'chapter': currentChapter()?.title || '章節',
    'add-book': '新增書本',
    'add-chapter': '章節心得',
    'edit-chapter': '編輯心得'
  };
  title.textContent = titles[name] || '讀書日誌';

  window.scrollTo(0, 0);
}

function navBack() {
  const prev = state.history.pop();
  if (prev) showView(prev, false);
  else showView('home', false);
}

function navAdd() {
  if (state.view === 'home') showAddBook();
  else if (state.view === 'book') showAddChapter();
}

/* ─────────── HELPERS ─────────── */
function currentBook() {
  return _cache.books.find(b => b.id === state.bookId) || null;
}

function currentChapter() {
  const b = currentBook();
  if (!b) return null;
  return b.chapters.find(c => c.id === state.chapterId) || null;
}

function sealText(title) {
  const raw = String(title || '');
  const quoted = raw.match(/[「『]([^」』]{1,6})[」』]/);   // 標題含引號時，印章取引號內的關鍵詞
  const base = (quoted ? quoted[1] : raw).replace(/[「」『』（）()［］\[\]，、。：:・\s]/g, '');
  const all = [...base];
  if (all.length <= 2) return all.join('<br>');
  if (all.length === 3) return all[0] + '<br>' + all.slice(1).join('');
  if (all.length <= 6) {                      // 5～6 字的標題整個放得下，平均分兩行
    const half = Math.ceil(all.length / 2);
    return all.slice(0, half).join('') + '<br>' + all.slice(half).join('');
  }
  const chars = all.slice(0, 4);
  return chars.slice(0, 2).join('') + '<br>' + chars.slice(2).join('');
}

    <div class="chapter-list-item" onclick="openChapter('${ch.id}')">
      <div class="chapter-num-badge">${i + 1}</div>
      <div class="chapter-list-body">
        <div class="chapter-list-title">${esc(ch.title)}</div>
        <div class="chapter-list-date">${esc(ch.date)}</div>
      </div>
      <div class="chapter-list-arrow">&#8250;</div>
    </div>
  `).join('');
}

/* ─────────── AI ANALYSIS ─────────── */
async function analyzeNotes(title, notes) {
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: `你是一個讀書筆記整理助手。使用者會給你一個章節標題和原始筆記，請分析並輸出 JSON（不要有任何其他文字）：
{
  "keywords": ["關鍵詞1", "關鍵詞2", "關鍵詞3"],
  "tactics": [
    { "ctx": "情境標籤", "main": "策略名稱", "sub": "詳細說明" }
  ],
  "techniques": [
    { "name": "技法名稱", "badge": "分類標籤", "body": "說明內容", "flow": ["步驟1", "步驟2"] }
  ]
}
keywords 最多 5 個，tactics 和 techniques 各視內容決定數量，flow 若無流程則為空陣列。請用繁體中文。`,
        messages: [{ role: 'user', content: `章節：${title}\n\n筆記：\n${notes}` }]
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || '{}';
    return JSON.parse(text.replace(/```json|```/g, '').trim());
  } catch(e) {
    console.error('AI analysis failed', e);
    return { keywords: [], tactics: [], techniques: [] };
  }
}

/* ═══════════════════════════════════════════════════════
   VISUALIZATION LAYER (圖解)
   把章節既有的 keywords / tactics / techniques / notes
   自動轉成心智圖、關鍵字雲、情境矩陣、流程圖與記憶卡。
   純 SVG + CSS，不依賴任何外部套件。
   ═══════════════════════════════════════════════════════ */

/* ─── 章節分頁切換 ─── */
function switchChapterTab(name) {
  state.chapterTab = name;
  ['notes', 'viz'].forEach(t => {
    document.getElementById('tab-btn-' + t).classList.toggle('active', t === name);
    document.getElementById('tab-pane-' + t).classList.toggle('active', t === name);
  });
  if (name === 'viz') renderChapterViz();
  window.scrollTo(0, 0);
}

/* ─── 從原始筆記推導結構（AI 分析缺席時的後備） ─── */
const BULLET_RE = /^(?:[•·▪◦\-–—*]+|[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]|[（(]?\d+[）).、]|\d+\s)/;

function noteLines(notes) {
  return String(notes || '')
    .split(/\n+/)
    .map(l => l.trim().replace(BULLET_RE, '').trim())
    .filter(l => l.length > 1);
}

function deriveFromNotes(ch) {
  const lines = noteLines(ch.notes);
  const tactics = [];
  const techniques = [];
  const points = [];

  lines.forEach(line => {
    const parts = line.split(/\s*(?:→|=>|➜)\s*/).map(s => s.trim()).filter(Boolean);
    if (parts.length >= 3) {
      techniques.push({ name: parts[0].slice(0, 18), badge: '流程', body: line, flow: parts });
      return;
    }
    const m = line.match(/^(對[^：:]{1,8}|遇到[^：:]{1,10}|[^：:]{1,8})\s*[：:]\s*(.+)$/);
    if (m && m[2].length > 1) {
      tactics.push({ ctx: m[1], main: m[2].slice(0, 40), sub: parts.length === 2 ? parts[1] : '' });
      return;
    }
    points.push(line);
  });

  return { tactics, techniques, points };
}

/* 產生本章統一的視覺化資料模型 */
function vizModel(ch) {
  const keywords = (ch.keywords || []).map(k => String(k).trim()).filter(Boolean);
  let tactics = (ch.tactics || []).filter(t => t && (t.main || t.sub));
  let techniques = (ch.techniques || []).filter(t => t && t.name);
  let points = [];

  // 沒有結構化資料時（例如 AI 整理失敗），退而從原始筆記自動拆解
  if (tactics.length === 0 && techniques.length === 0) {
    const d = deriveFromNotes(ch);
    tactics = d.tactics;
    techniques = d.techniques;
    points = d.points;
  }

  const corpus = [
    ch.notes || '',
    ...tactics.map(t => `${t.ctx || ''} ${t.main || ''} ${t.sub || ''}`),
    ...techniques.map(t => `${t.name || ''} ${t.body || ''} ${(t.flow || []).join(' ')}`),
    ...points
  ].join('\n');

  return { keywords, tactics, techniques, points, corpus, isEmpty: keywords.length === 0 && tactics.length === 0 && techniques.length === 0 && points.length === 0 };
}

/* ─── 文字寬度估算（中日韓全形字約等於字級寬） ─── */
const CJK_RE = /[⺀-鿿　-〿＀-｠￠-￦]/;
function textW(str, fontSize) {
  let w = 0;
  for (const c of String(str)) w += CJK_RE.test(c) ? fontSize : fontSize * 0.56;
  return w;
}
function clip(str, n) {
  const s = String(str || '').replace(/\s+/g, ' ').trim();
  return [...s].length > n ? [...s].slice(0, n).join('') + '…' : s;
}

/* ─── 心智圖 ─── */
const BRANCH_COLORS = ['#993C1D', '#A87438', '#6E6A4E', '#7C4A54'];

function buildMindmap(ch, m) {
  const groups = [];
  if (m.keywords.length) {
    groups.push({ name: '核心關鍵字', leaves: m.keywords.map(k => ({ main: clip(k, 12) })) });
  }
  if (m.tactics.length) {
    groups.push({
      name: '因人制宜策略',
      leaves: m.tactics.map(t => ({ main: clip(t.main || t.ctx, 14), sub: clip(t.ctx || '', 10) }))
    });
  }
  if (m.techniques.length) {
    groups.push({
      name: '進階技法',
      leaves: m.techniques.map(t => ({ main: clip(t.name, 14), sub: clip(t.badge || '', 10) }))
    });
  }
  if (m.points.length) {
    groups.push({ name: '筆記重點', leaves: m.points.slice(0, 12).map(p => ({ main: clip(p, 16) })) });
  }
  if (groups.length === 0) return '';

  const PAD = 14;
  const F_ROOT = 16, F_CAT = 13, F_LEAF = 12.5, F_SUB = 10;
  const ROOT_H = 44, CAT_H = 32;
  const LEAF_GAP = 9, GROUP_GAP = 20;
  const GAP_X = 36;

  const rootLabel = clip(ch.title, 10);
  const rootW = textW(rootLabel, F_ROOT) + 30;
  const catW = Math.max(...groups.map(g => textW(g.name, F_CAT))) + 24;
  const leafW = Math.max(...groups.flatMap(g =>
    g.leaves.map(l => Math.max(textW(l.main, F_LEAF), l.sub ? textW(l.sub, F_SUB) : 0))
  )) + 22;

  const rootX = PAD;
  const catX = rootX + rootW + GAP_X;
  const leafX = catX + catW + GAP_X;

  // 垂直排版
  let y = PAD;
  groups.forEach(g => {
    g.leaves.forEach(l => {
      l.h = l.sub ? 40 : 30;
      l.y = y + l.h / 2;
      y += l.h + LEAF_GAP;
    });
    y = y - LEAF_GAP + GROUP_GAP;
    const first = g.leaves[0], last = g.leaves[g.leaves.length - 1];
    g.y = (first.y + last.y) / 2;
  });
  const totalH = y - GROUP_GAP + PAD;
  const rootY = (groups[0].y + groups[groups.length - 1].y) / 2;
  const totalW = leafX + leafW + PAD;

  const curve = (x1, y1, x2, y2, color) => {
    const mx = (x1 + x2) / 2;
    return `<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" fill="none" stroke="${color}" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round"/>`;
  };

  let links = '', nodes = '';

  groups.forEach((g, gi) => {
    const color = BRANCH_COLORS[gi % BRANCH_COLORS.length];
    links += curve(rootX + rootW, rootY, catX, g.y, color);

    nodes += `<g>
      <rect x="${catX}" y="${g.y - CAT_H / 2}" width="${catW}" height="${CAT_H}" rx="8" fill="${color}" fill-opacity="0.12" stroke="${color}" stroke-opacity="0.55" stroke-width="1"/>
      <text x="${catX + catW / 2}" y="${g.y}" text-anchor="middle" dominant-baseline="central" font-family="'Noto Serif TC', serif" font-size="${F_CAT}" font-weight="700" fill="${color}" letter-spacing="0.5">${esc(g.name)}</text>
    </g>`;

    g.leaves.forEach(l => {
      links += curve(catX + catW, g.y, leafX, l.y, color);
      const ty = l.sub ? l.y - 7 : l.y;
      nodes += `<g>
        <rect x="${leafX}" y="${l.y - l.h / 2}" width="${leafW}" height="${l.h}" rx="8" fill="#FFFFFF" stroke="${color}" stroke-opacity="0.32" stroke-width="1"/>
        <text x="${leafX + 11}" y="${ty}" dominant-baseline="central" font-family="'Noto Sans TC', sans-serif" font-size="${F_LEAF}" fill="#1A1814">${esc(l.main)}</text>
        ${l.sub ? `<text x="${leafX + 11}" y="${l.y + 10}" dominant-baseline="central" font-family="'Noto Sans TC', sans-serif" font-size="${F_SUB}" fill="#9E9C96">${esc(l.sub)}</text>` : ''}
      </g>`;
    });
  });

  const root = `<g>
    <rect x="${rootX}" y="${rootY - ROOT_H / 2}" width="${rootW}" height="${ROOT_H}" rx="10" fill="#993C1D"/>
    <text x="${rootX + rootW / 2}" y="${rootY}" text-anchor="middle" dominant-baseline="central" font-family="'Noto Serif TC', serif" font-size="${F_ROOT}" font-weight="700" fill="#FDE8E0" letter-spacing="1.2">${esc(rootLabel)}</text>
  </g>`;

  return `<svg width="${Math.round(totalW)}" height="${Math.round(totalH)}" viewBox="0 0 ${Math.round(totalW)} ${Math.round(totalH)}" xmlns="http://www.w3.org/2000/svg">${links}${root}${nodes}</svg>`;
}

/* ─── 心智圖縮放 ───
   手機（<1024px）：維持原本的「縮成一頁 / 放大細看」切換＋原生捲動。
   桌面（>=1024px）：固定高度視窗，進場自動 fit 到看得見全貌，
   之後可用 ＋/− 按鈕、⌘/Ctrl+滾輪縮放，按住拖曳平移。            */
const DESKTOP_MQ = '(min-width: 1024px)';
function isDesktopViz() { return window.matchMedia(DESKTOP_MQ).matches; }

let mmZoom = 1;

function mindmapSvg() {
  const svg = document.querySelector('#mindmap-scroll svg');
  if (!svg) return null;
  return { svg, w: parseFloat(svg.getAttribute('width')) || 1, h: parseFloat(svg.getAttribute('height')) || 1 };
}

function applyMindmapZoom() {
  const n = mindmapSvg();
  if (!n) return;
  n.svg.style.width = (n.w * mmZoom) + 'px';
  n.svg.style.height = 'auto';
  const lbl = document.getElementById('mindmap-zoom-label');
  if (lbl) lbl.textContent = Math.round(mmZoom * 100) + '%';
}

/* 桌面：算出「寬高都塞得進視窗」的縮放比，最多放大到 1.5 倍避免字過肥 */
function fitMindmapDesktop() {
  const el = document.getElementById('mindmap-scroll');
  const n = mindmapSvg();
  if (!el || !n) return;
  el.classList.remove('fit');
  const availW = el.clientWidth - 24;
  const availH = el.clientHeight - 24;
  mmZoom = Math.max(0.35, Math.min(availW / n.w, availH / n.h, 1.5));
  applyMindmapZoom();
  el.scrollLeft = Math.max(0, (el.scrollWidth - el.clientWidth) / 2);
  el.scrollTop = 0;

  const hint = document.getElementById('mindmap-hint');
  if (hint) {
    hint.style.display = '';
    hint.textContent = '按住拖曳可平移　⌘/Ctrl＋滾輪縮放';
  }
}

function mindmapZoom(delta) {
  if (!isDesktopViz()) return;
  const el = document.getElementById('mindmap-scroll');
  if (!el) return;
  const cx = el.scrollLeft + el.clientWidth / 2;
  const cy = el.scrollTop + el.clientHeight / 2;
  const before = mmZoom;
  mmZoom = Math.min(2.5, Math.max(0.3, +(mmZoom + delta).toFixed(3)));
  applyMindmapZoom();
  const k = mmZoom / before;
  el.scrollLeft = cx * k - el.clientWidth / 2;
  el.scrollTop = cy * k - el.clientHeight / 2;
}

function mindmapReset() { fitMindmapDesktop(); }

/* 桌面互動：拖曳平移 + ⌘/Ctrl 滾輪縮放（單純滾輪保留給頁面捲動） */
function attachMindmapPanZoom(el) {
  if (!el || el.dataset.pz === '1') return;
  el.dataset.pz = '1';

  let dragging = false, sx = 0, sy = 0, sl = 0, st = 0;

  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch' || !isDesktopViz()) return;
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    sl = el.scrollLeft; st = el.scrollTop;
    el.classList.add('dragging');
    el.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    el.scrollLeft = sl - (e.clientX - sx);
    el.scrollTop = st - (e.clientY - sy);
  });

  const stop = e => {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    try { el.releasePointerCapture(e.pointerId); } catch (_) {}
  };
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointercancel', stop);

  el.addEventListener('wheel', e => {
    if (!isDesktopViz() || !(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    mindmapZoom(e.deltaY > 0 ? -0.12 : 0.12);
  }, { passive: false });
}

/* 心智圖顯示模式：fit＝整張縮進一頁；natural＝原始大小＋左右滑動 */
function setMindmapMode(fit) {
  const el = document.getElementById('mindmap-scroll');
  const btn = document.getElementById('mindmap-fit-btn');
  const hint = document.getElementById('mindmap-hint');
  const svg = el && el.querySelector('svg');
  if (!el || !svg || !btn) return;

  const natural = parseFloat(svg.getAttribute('width')) || 0;
  const exact = natural <= el.clientWidth - 12;   // 本來就放得下，不需要按鈕

  el.classList.toggle('fit', fit);
  btn.textContent = fit ? '放大細看' : '縮成一頁';
  btn.style.display = exact ? 'none' : '';
  if (hint) {
    hint.style.display = exact ? 'none' : '';
    hint.textContent = fit ? '已縮成一頁　點右側可放大' : '左右滑動看完整';
  }
}

/* 進場自動決定顯示方式：桌面 fit-to-view，手機縮到 0.6 倍內就預設全覽 */
function autoFitMindmap() {
  const el = document.getElementById('mindmap-scroll');
  const svg = el && el.querySelector('svg');
  if (!el || !svg) return;

  attachMindmapPanZoom(el);

  if (isDesktopViz()) {
    fitMindmapDesktop();
    return;
  }

  // 手機：清掉桌面留下的行內尺寸，回到原本的邏輯
  svg.style.width = '';
  svg.style.height = '';
  const natural = parseFloat(svg.getAttribute('width')) || 0;
  const avail = el.clientWidth - 12;
  setMindmapMode(natural <= avail || avail / natural >= 0.6);
}

/* 視窗縮放／跨越斷點時重新校正心智圖 */
let _mmResizeTimer = null;
window.addEventListener('resize', () => {
  if (state.view !== 'chapter' || state.chapterTab !== 'viz') return;
  clearTimeout(_mmResizeTimer);
  _mmResizeTimer = setTimeout(autoFitMindmap, 150);
});

function toggleMindmapFit() {
  const el = document.getElementById('mindmap-scroll');
  if (!el) return;
  setMindmapMode(!el.classList.contains('fit'));
}

/* ─── 關鍵字雲 ─── */
function buildCloud(m) {
  let terms = m.keywords.slice();
  if (terms.length === 0) {
    terms = [...new Set(m.tactics.map(t => t.ctx).concat(m.techniques.map(t => t.name)))].filter(Boolean).slice(0, 10);
  }
  if (terms.length === 0) return '';

  const scored = terms.map(t => {
    let n = 0;
    for (const piece of String(t).split(/[、，,\/]/).map(s => s.trim()).filter(Boolean)) {
      n = Math.max(n, m.corpus.split(piece).length - 1);
    }
    return { t: String(t).trim(), n: Math.max(n, 1) };
  });

  const max = Math.max(...scored.map(s => s.n));
  const min = Math.min(...scored.map(s => s.n));
  const span = Math.max(max - min, 1);

  return `<div class="kw-cloud">${scored.map(s => {
    const r = (s.n - min) / span;
    const size = (1 + r * 0.67).toFixed(2);
    const color = r > 0.66 ? 'var(--red-dark)' : (r > 0.33 ? 'var(--red)' : 'var(--text2)');
    return `<span class="kw-word" style="font-size:${size}em;color:${color}" title="在本章出現約 ${s.n} 次">${esc(s.t)}</span>`;
  }).join('')}</div>`;
}

/* ─── 情境對照矩陣 ─── */
function buildMatrix(m) {
  if (m.tactics.length === 0) return '';
  const groups = new Map();
  m.tactics.forEach(t => {
    const key = (t.ctx || '通用').trim() || '通用';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(t);
  });

  return `<div class="ctx-grid">${[...groups.entries()].map(([ctx, list]) => `
    <div class="ctx-card">
      <div class="ctx-card-head"><span>${esc(ctx)}</span><span class="ctx-card-count">${list.length} 招</span></div>
      <div class="ctx-card-body">
        ${list.map(t => `
          <div class="ctx-row">
            <span class="ctx-dot"></span>
            <div>
              <div class="ctx-main">${esc(t.main || '')}</div>
              ${t.sub ? `<div class="ctx-sub">${esc(t.sub)}</div>` : ''}
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('')}</div>`;
}

/* ─── 流程圖 ─── */
function buildFlows(m) {
  const withFlow = m.techniques.filter(t => Array.isArray(t.flow) && t.flow.length > 1);
  if (withFlow.length === 0) return '';
  return withFlow.map(t => `
    <div class="flowc">
      <div class="flowc-head">
        <span class="flowc-name">${esc(t.name)}</span>
        ${t.badge ? `<span class="technique-badge">${esc(t.badge)}</span>` : ''}
      </div>
      <div class="flowc-steps">
        ${t.flow.map((f, i) => `
          <div class="flowc-step">
            <span class="flowc-num">${i + 1}</span>
            <span class="flowc-txt">${esc(f)}</span>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

/* ─── 記憶卡 ─── */
let fc = { cards: [], i: 0, flipped: false };

function buildCards(m) {
  const cards = [];

  m.tactics.forEach(t => {
    const ctx = (t.ctx || '').trim();
    if (ctx && ctx !== '通用' && t.main) {
      cards.push({ kind: '情境策略', q: `「${ctx}」該怎麼做？`, a: t.main, body: t.sub || '', flow: [] });
    } else if (t.main) {
      cards.push({ kind: '情境策略', q: t.main, a: '', body: t.sub || '', flow: [] });
    }
  });

  m.techniques.forEach(t => {
    cards.push({
      kind: '進階技法',
      q: t.name,
      a: t.badge || '',
      body: t.body || '',
      flow: Array.isArray(t.flow) ? t.flow : []
    });
  });

  m.keywords.forEach(k => {
    const key = String(k).trim();
    if (!key) return;
    const hits = [];
    m.tactics.forEach(t => {
      const txt = `${t.main || ''} ${t.sub || ''}`;
      if (String(key).split(/[、，,\/]/).some(p => p.trim() && txt.includes(p.trim()))) hits.push(t.main);
    });
    m.techniques.forEach(t => {
      const txt = `${t.name || ''} ${t.body || ''}`;
      if (String(key).split(/[、，,\/]/).some(p => p.trim() && txt.includes(p.trim()))) hits.push(t.name);
    });
    if (hits.length) {
      cards.push({ kind: '核心關鍵字', q: key, a: '本章相關做法', body: hits.slice(0, 4).map(h => '・' + h).join('\n'), flow: [] });
    }
  });

  m.points.slice(0, 15).forEach(p => {
    cards.push({ kind: '筆記重點', q: clip(p, 20), a: '', body: p, flow: [] });
  });

  return cards;
}

function renderFlashcards() {
  const el = document.getElementById('viz-fc');
  if (!el) return;
  if (fc.cards.length === 0) { el.innerHTML = ''; return; }

  const c = fc.cards[fc.i];
  el.innerHTML = `
    <div class="fc-stage">
      <div class="fc-card${fc.flipped ? ' flipped' : ''}" id="fc-card" onclick="fcFlip()">
        <div class="fc-face fc-front">
          <div class="fc-kind">${esc(c.kind)}</div>
          <div class="fc-q">${esc(c.q)}</div>
          <div class="fc-tap">點一下翻面看答案</div>
        </div>
        <div class="fc-face fc-back">
          <div class="fc-kind">${esc(c.kind)}</div>
          ${c.a ? `<div class="fc-a-main">${esc(c.a)}</div>` : ''}
          ${c.body ? `<div class="fc-a-body">${esc(c.body)}</div>` : ''}
          ${c.flow && c.flow.length > 1 ? `<div class="fc-a-flow">${c.flow.map((f, i) => `<span class="flow-pill">${esc(f)}</span>${i < c.flow.length - 1 ? '<span class="flow-arr">→</span>' : ''}`).join('')}</div>` : ''}
        </div>
      </div>
    </div>
    <div class="fc-bar">
      <button class="fc-btn" onclick="fcMove(-1)" ${fc.i === 0 ? 'disabled' : ''} aria-label="上一張">&#8249;</button>
      <div class="fc-mid">
        <div class="fc-count">${fc.i + 1} / ${fc.cards.length}</div>
        <div class="fc-dots">${fc.cards.map((_, i) => `<span class="fc-dot${i === fc.i ? ' on' : ''}"></span>`).join('')}</div>
      </div>
      <button class="fc-btn" onclick="fcMove(1)" ${fc.i === fc.cards.length - 1 ? 'disabled' : ''} aria-label="下一張">&#8250;</button>
    </div>
    <button class="fc-shuffle" onclick="fcShuffle()">&#8635; 洗牌重來</button>
  `;
  attachSwipe(document.getElementById('fc-card'));
}

function fcFlip() {
  fc.flipped = !fc.flipped;
  const card = document.getElementById('fc-card');
  if (card) card.classList.toggle('flipped', fc.flipped);
}

function fcMove(d) {
  const next = fc.i + d;
  if (next < 0 || next >= fc.cards.length) return;
  fc.i = next;
  fc.flipped = false;
  renderFlashcards();
}

function fcShuffle() {
  for (let i = fc.cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [fc.cards[i], fc.cards[j]] = [fc.cards[j], fc.cards[i]];
  }
  fc.i = 0;
  fc.flipped = false;
  renderFlashcards();
  showToast('🔀 已洗牌');
}

function attachSwipe(el) {
  if (!el) return;
  let x0 = null, y0 = null, moved = false;
  el.addEventListener('touchstart', e => {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; moved = false;
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (x0 === null) return;
    if (Math.abs(e.touches[0].clientX - x0) > 12) moved = true;
  }, { passive: true });
  el.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (moved && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
      e.preventDefault();
      fcMove(dx < 0 ? 1 : -1);
    }
  });
}

/* ─── 組裝整個「圖解」面板 ─── */
function renderChapterViz() {
  const ch = currentChapter();
  const el = document.getElementById('chapter-viz-content');
  if (!ch || !el) return;

  const m = vizModel(ch);

  if (m.isEmpty) {
    el.innerHTML = `<div class="viz-empty">
      <div class="empty-icon">🗺️</div>
      <div class="empty-title">這章還沒有可以畫的內容</div>
      <div class="empty-sub">先在「心得」分頁補上原始筆記，<br>圖解會自動從筆記生成。</div>
    </div>`;
    return;
  }

  const mindmap = buildMindmap(ch, m);
  const cloud = buildCloud(m);
  const matrix = buildMatrix(m);
  const flows = buildFlows(m);

  fc = { cards: buildCards(m), i: 0, flipped: false };

  const blocks = [];

  if (mindmap) blocks.push(`
    <div class="viz-block">
      <div class="viz-head">
        <span class="viz-title">全章心智圖</span>
        <span class="viz-hint" id="mindmap-hint">左右滑動看完整</span>
        <button class="viz-tool" id="mindmap-fit-btn" onclick="toggleMindmapFit()">縮放全覽</button>
        <div class="mm-zoom" id="mindmap-zoom">
          <button class="mm-zbtn" onclick="mindmapZoom(-0.15)" aria-label="縮小">&#8722;</button>
          <span class="mm-zlabel" id="mindmap-zoom-label">100%</span>
          <button class="mm-zbtn" onclick="mindmapZoom(0.15)" aria-label="放大">&#43;</button>
          <button class="mm-zbtn mm-zreset" onclick="mindmapReset()">重置</button>
        </div>
      </div>
      <div class="mindmap-scroll" id="mindmap-scroll">${mindmap}</div>
    </div>`);

  if (cloud) blocks.push(`
    <div class="viz-block">
      <div class="viz-head"><span class="viz-title">關鍵字雲</span><span class="viz-hint">字越大＝本章出現越多</span></div>
      ${cloud}
    </div>`);

  if (matrix) blocks.push(`
    <div class="viz-block">
      <div class="viz-head"><span class="viz-title">情境對照矩陣</span><span class="viz-hint">按情境分組，遇到就對照</span></div>
      ${matrix}
    </div>`);

  if (flows) blocks.push(`
    <div class="viz-block">
      <div class="viz-head"><span class="viz-title">操作流程圖</span><span class="viz-hint">照順序走</span></div>
      <div class="viz-flows">${flows}</div>
    </div>`);

  if (fc.cards.length) blocks.push(`
    <div class="viz-block">
      <div class="viz-head"><span class="viz-title">記憶卡複習</span><span class="viz-hint">點卡片翻面，左右滑換卡</span></div>
      <div class="fc-holder" id="viz-fc"></div>
    </div>`);

  el.innerHTML = `<div class="viz-wrap">${blocks.join('')}</div>`;
  if (mindmap) autoFitMindmap();
  if (fc.cards.length) renderFlashcards();
}

/* ─────────── ESCAPE ─────────── */
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ─────────── INIT ─────────── */
async function init() {
  // Show loading
  document.getElementById('book-list').innerHTML = `<div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-title">載入中...</div><div class="empty-sub">正在從雲端讀取資料</div></div>`;

  await seedAndMigrate();
  renderHome();
  startRealtimeSync();
}
